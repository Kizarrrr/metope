mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

hosts:
  ntc.party: 130.255.77.28

dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.stun.*.*'
    - 'connectivitycheck.gstatic.com'
    - 'captive.apple.com'
  nameserver-policy:
    '+.polaris-iot.com': 'https://77.88.8.8/dns-query'
    'rule-set:gemini': 'https://dns.dns-ai.ru/dns-query'
    'rule-set:ai': 'https://dns.dns-ai.ru/dns-query'
  default-nameserver:
    - 77.88.8.8
    - 8.8.8.8
    - 1.1.1.1
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://77.88.8.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://8.8.4.4/dns-query
    - https://77.88.8.8/dns-query
    - https://77.88.8.1/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, '8080-8880']
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'

tun:
  enable: false
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true

